services:
  # ==========================================
  # 1. Backend Service (FastAPI + FFmpeg Docker)
  # ==========================================
  - type: web
    name: osama-studio-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: PYTHONUNBUFFERED
        value: "1"

  # ==========================================
  # 2. Frontend Service (Next.js YouTube Studio UI)
  # ==========================================
  - type: web
    name: osama-studio-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm start
    plan: starter
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
